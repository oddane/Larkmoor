name: Component or token request
description: Propose a new component, variant or token.
labels: ["type: proposal", "status: triage"]
body:
  - type: markdown
    attributes:
      value: Larkmoor only adds what a real page needs. Please check the docs and CLAUDE.md for something that already fits.
  - type: textarea
    id: need
    attributes: { label: The page and task that need it, description: "Link or describe the real page." }
    validations: { required: true }
  - type: textarea
    id: existing
    attributes: { label: Why existing tokens or components don't fit }
    validations: { required: true }
  - type: textarea
    id: states
    attributes: { label: States and keyboard behaviour, description: "Default, hover, focus, disabled, error… and the ARIA Authoring Practices pattern if it's a custom widget." }
