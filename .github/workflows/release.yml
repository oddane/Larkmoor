name: Release
on:
  push: { tags: ["v*.*.*"] }
  workflow_dispatch:
    inputs:
      tag: { description: "Existing tag to (re)build the release package for, e.g. v0.1.0", required: true }
permissions: { contents: write }
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # same environment as CI: GitHub's own visual baselines and the shared-runner blocking-time guard
  LARKMOOR_BASELINES: tests/baselines/ci
  LARKMOOR_TBT_BUDGET: 1000
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: npm pack
      - name: Attach the package to the GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # works whether the release was drafted in the GitHub UI (which creates the tag) or not
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" larkmoor-design-system-*.tgz --clobber
          else
            notes=$(awk "/^## ${TAG#v} /{f=1;next} /^## /{f=0} f" CHANGELOG.md)
            gh release create "$TAG" larkmoor-design-system-*.tgz --title "Larkmoor $TAG" --notes "$notes"
          fi
