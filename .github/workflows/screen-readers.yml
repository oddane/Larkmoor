name: Screen readers
# Real VoiceOver (macOS + WebKit) and NVDA (Windows + Firefox) read tests/screen-reader/index.html,
# driven by Guidepup. Every spoken phrase is uploaded as evidence, pass or fail.
on:
  push:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "sr-${{ github.ref }}", cancel-in-progress: true }
env:
  SR_DEPS: "@playwright/test@1.64.1 @guidepup/guidepup@0.24.1 @guidepup/playwright"
jobs:
  voiceover:
    name: VoiceOver (macOS, WebKit)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund $SR_DEPS
      - run: npm ls @playwright/test @guidepup/guidepup @guidepup/playwright || true
      - name: Prepare VoiceOver for automation
        run: npx --yes @guidepup/setup@0.23.0 --ci --record
      - run: npx playwright install webkit
      - run: npx playwright test -c tests/screen-reader/playwright.config.mjs --project=voiceover
      - name: Upload what VoiceOver said
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: voiceover, path: "reports/screen-reader/\ntest-results/\nrecordings/", retention-days: 30 }

  nvda:
    name: NVDA (Windows, Firefox)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund $SR_DEPS
      - run: npm ls @playwright/test @guidepup/guidepup @guidepup/playwright || true
      - name: Install and configure NVDA
        run: npx --yes @guidepup/setup@0.23.0 --ci
      - run: npx playwright install firefox
      - run: npx playwright test -c tests/screen-reader/playwright.config.mjs --project=nvda
      - name: Upload what NVDA said
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: nvda, path: "reports/screen-reader/\ntest-results/", retention-days: 30 }
