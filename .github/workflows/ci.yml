name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: write }   # only used to commit first-time CI visual baselines on main
    env:
      LARKMOOR_BASELINES: tests/baselines/ci
      LARKMOOR_TBT_BUDGET: 1000  # ceiling only: shared runners measured 180–463ms for identical code; the 200ms budget is enforced on the reference machine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: npm install --no-audit --no-fund   # switch to `npm ci` once package-lock.json is committed
      - run: npx playwright install --with-deps chromium
      - name: Generated files are committed
        run: npm run build && npm run examples && git diff --exit-code -- dist docs/vendor examples
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:browser
      - run: npm run pack:check
      - name: Commit first-time CI visual baselines
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain -- tests/baselines/ci)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/baselines/ci
            git commit -m "Record CI visual baselines"
            git push
          fi
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: reports, path: reports/, retention-days: 14 }

  react-native:
    name: React Native type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      # the same versions as the Tauawo app; installed only for this check
      - run: npm install --no-save --no-audit --no-fund react@19.3.0 react-native@0.88.1 react-native-safe-area-context@5.10.1 @types/react@19.3.0 typescript@6.0.3
      - run: npx tsc -p tests/native/tsconfig.json

  ios:
    name: SwiftUI compile
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: swiftc --version
      - name: Type-check for macOS
        run: swiftc -typecheck -target arm64-apple-macos14 dist/ios/*.swift
      - name: Type-check for iPhone (iOS 16 simulator SDK)
        run: swiftc -typecheck -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -target arm64-apple-ios16.0-simulator dist/ios/*.swift

  android:
    name: Kotlin compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: command -v kotlinc || sudo snap install --classic kotlin
      - run: kotlinc dist/android/LarkmoorTokens.kt -d /tmp/larkmoor.jar && echo "compiled"
      - name: Compile the Android-only helper against the newest android.jar on the runner
        run: |
          JAR="$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar"
          echo "using $JAR"
          kotlinc -cp "$JAR" dist/android/LarkmoorAndroid.kt -d /tmp/larkmoor-android.jar && echo "compiled"

  compose:
    name: Jetpack Compose compile (theme, components, sample)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle --no-daemon -p tests/compose compileKotlin
